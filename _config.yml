# ============================================================
# DATA AND HUMAN SPACE
# Sanad Madi
# Fall 2026
# ============================================================

# Site Settings
title: "Data & Human Space"
email: ""
description: >-
  A digital portfolio by Sanad Madi exploring maps, geospatial data,
  human space, digital cartography, and spatial storytelling.

url: "https://sanadmadi12.github.io"
baseurl: "/DHS"

github_username: sanadmadi12

# Theme
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: default

# Site Features
search: true

# Build Settings
markdown: kramdown
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Asia/Dubai

# Pages
include:
  - _pages

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# ============================================================
# AUTHOR
# ============================================================

author:
  name: "Sanad Madi"
  avatar: "/DHS/assets/images/bio-photo.jpg"
  bio: "Engineering student at NYU Abu Dhabi exploring data, maps, technology, and human space."
  location: "Abu Dhabi, UAE"

  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/sanadmadi12"

# ============================================================
# FOOTER
# ============================================================

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/sanadmadi12"

# ============================================================
# DEFAULT PAGE SETTINGS
# ============================================================

defaults:

  # Posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false

  # Pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# ============================================================
# ARCHIVES
# ============================================================

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/