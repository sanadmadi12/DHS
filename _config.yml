# Welcome to Jekyll!
#
# Site configuration for Data & Human Space
# Sanad Madi
# NYU Abu Dhabi, Fall 2026

# Site settings
title: "Data & Human Space"
email:
description: >-
  A digital portfolio by Sanad Madi exploring maps, geospatial data,
  human space, digital cartography, and spatial storytelling.

twitter_username:
github_username: sanadmadi12

# Visual theme
minimal_mistakes_skin: air

# Search
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Asia/Dubai

# GitHub Pages URL
url: "https://sanadmadi12.github.io"
baseurl: "/DHS"

# Pages
include:
  - _pages

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Author profile
author:
  name: "Sanad Madi"
  avatar: "/DHS/assets/images/bio-photo.jpg"
  bio: "Engineering student at NYU Abu Dhabi exploring data, maps, technology, and human space."
  location: "Abu Dhabi, UAE"

  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/sanadmadi12"

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/sanadmadi12"

# Default settings
defaults:

  # Posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false

  # Pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Category archive
category_archive:
  type: liquid
  path: /categories/

# Tag archive
tag_archive:
  type: liquid
  path: /tags/